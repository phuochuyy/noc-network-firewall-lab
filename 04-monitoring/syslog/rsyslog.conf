# One file per sending host in /logs (bind mount: ~/.local/state/noc-syslog), read by the Zabbix agent.
global(workDirectory="/tmp")
module(load="imudp")
input(type="imudp" port="5514")
template(name="perhost" type="string" string="/logs/%HOSTNAME%.log")
template(name="line" type="string" string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
*.* action(type="omfile" dynaFile="perhost" template="line" dirCreateMode="0750" fileCreateMode="0640")
