# Firewall checks run by the KVM host's agent (lab user, SSH key to root@fw1 on the LAN; included from
# noc-monitoring-incident-lab/02-agents/host/zabbix_agent2.conf, which lists "fw1" in Hostname).
# SHA-256 of the running configuration: any change (GUI, API, console) shows up, with or without a ticket
UserParameter=noc.fw.confighash,ssh -o BatchMode=yes -o ConnectTimeout=5 root@10.90.10.1 'sha256 -q /conf/config.xml'
# pf state table entries (connections tracked)
UserParameter=noc.fw.pf.states,ssh -o BatchMode=yes -o ConnectTimeout=5 root@10.90.10.1 "pfctl -si" 2>/dev/null | awk '/current entries/{print $3}'
# Top source of blocked inbound WAN packets in the last 60 s ("ip (count)"), multicast / broadcast excluded.
# Replaces "last blocked line", which named an mDNS packet of the host instead of the scanner (drill r1).
UserParameter=noc.fw.wan.topsrc,awk -v c="$(date -d '-60 sec' +%Y-%m-%dT%H:%M:%S)" -F, '$1 >= c && /filterlog/ && $5=="vtnet1" && $7=="block" && $8=="in" && $9=="4" && $20 !~ /^(22[4-9]|23[0-9]|255)\./ {n[$19]++} END {for (s in n) if (n[s] > m) {m = n[s]; t = s}; print (m ? t " (" m ")" : "-")}' /home/huy/.local/state/noc-syslog/fw1.noc.lab.log
